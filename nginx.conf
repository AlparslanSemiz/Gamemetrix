events { worker_connections 1024; }
http {
    client_max_body_size 1m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    # TLS is terminated at Cloudflare, so $scheme is always "http" inside nginx.
    # With nginx's default absolute_redirect, `return 308 /admin` below would emit
    # Location: http://gamemetrix.me/admin and downgrade the client to plaintext.
    # Relative Locations keep the browser on the scheme it arrived with.
    absolute_redirect off;

    # Compression. HTML, the JSON API and the sitemap are all highly compressible
    # and were previously served raw, which costs Core Web Vitals on every page.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/xml+rss
        application/json
        application/javascript
        application/manifest+json
        image/svg+xml;

    # X-Forwarded-Proto is caller-settable and deliberately NOT gated by peer
    # address: Docker's published-port path can present the bridge gateway as
    # nginx's direct peer, which made an earlier source-IP gate fail closed and
    # produced a Cloudflare redirect loop.
    #
    # Leaving it ungated is acceptable only because nothing downstream derives a
    # security decision from it: session cookies use secure=is_production
    # (account_security.py) and no absolute URL is built from the request scheme.
    # Re-gate this the moment that stops being true.
    map $http_x_forwarded_proto $public_scheme {
        default $scheme;
        https https;
        http http;
    }

    # Client IP resolution.
    #
    # CF-Connecting-IP is only honoured when the request actually arrives from a
    # Cloudflare edge address. Previously any caller could set that header and be
    # believed, which let one attacker rotate it to get unlimited attempts against
    # the auth endpoints (the rate limiter keys on this value) and to write forged
    # addresses into the audit and analytics tables.
    #
    # CAVEAT — this gate only works if nginx sees the real TCP peer. If Docker's
    # published-port path SNATs the source to the bridge gateway (the condition
    # blamed for the redirect loop above), none of these ranges ever match,
    # $remote_addr collapses to one address for every visitor, and the backend's
    # per-IP auth limit becomes a single global bucket that one attacker can
    # exhaust for everyone. The origin_trust log format below exists to prove
    # which case is real: $realip_remote_addr is non-empty only when realip fired.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # real=<empty> means realip did not fire, i.e. the peer was not a Cloudflare
    # address and every client below is sharing one rate-limit key at the backend.
    log_format origin_trust '$remote_addr real=$realip_remote_addr '
                            'cf="$http_cf_connecting_ip" xfp="$http_x_forwarded_proto" '
                            '"$request" $status';
    access_log /var/log/nginx/access.log origin_trust;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.gamemetrix.me https://www.google-analytics.com https://*.google-analytics.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self' https:; upgrade-insecure-requests" always;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://gamemetrix.me$request_uri;
    }

    # --- 1. API YÖNLENDİRMESİ (api.gamemetrix.me) ---
    server {
        listen 80;
        listen [::]:80;
        server_name api.gamemetrix.me;
        resolver 127.0.0.11 valid=30s;
        # Redirect only on an explicit "http" claim. A missing header must not
        # redirect: $scheme is always http here, so defaulting to a redirect sent
        # every header-less request to a scheme this origin cannot serve, which is
        # the redirect loop itself. Cloudflare's "Always Use HTTPS" is the real
        # scheme enforcement for visitors.
        if ($http_x_forwarded_proto = http) {
            return 301 https://api.gamemetrix.me$request_uri;
        }
        location / {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $public_scheme;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name www.gamemetrix.me;
        return 301 https://gamemetrix.me$request_uri;
    }

    # --- 2. ANA SİTE YÖNLENDİRMESİ (gamemetrix.me) ---
    server {
        listen 80;
        listen [::]:80;
        server_name gamemetrix.me;
        resolver 127.0.0.11 valid=30s;
        if ($http_x_forwarded_proto = http) {
            return 301 https://gamemetrix.me$request_uri;
        }

        # Every proxying location must overwrite the full X-Forwarded-* set.
        # nginx passes unrecognised client headers upstream untouched, and uvicorn
        # runs with --proxy-headers --forwarded-allow-ips 172.16.0.0/12, so any
        # header left unset here is a caller-controlled rate-limit key.
        location = /robots.txt {
            set $frontend_robots http://frontend:3000;
            proxy_pass $frontend_robots;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_hide_header Cache-Control;
            expires 1h;
        }
        # The sitemap index (/sitemap.xml) plus its children — /sitemap-static.xml
        # and /sitemap-games-N.xml — are all served by the backend.
        location ~ ^/sitemap[\w-]*\.xml$ {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $public_scheme;
        }
        location /api/ {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $public_scheme;
        }
        location = /admin {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            # Enforced here rather than via the route's headers() export, which the
            # v8_middleware future flag no longer applies. The admin shell must
            # never sit in a shared/edge cache.
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            # nginx replaces rather than merges add_header: declaring any header at
            # this level drops every http-level one. Without these repeats the admin
            # shell is the only route served with no CSP and no X-Frame-Options,
            # i.e. the one page an attacker can frame.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Permitted-Cross-Domain-Policies "none" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.gamemetrix.me https://www.google-analytics.com https://*.google-analytics.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self' https:; upgrade-insecure-requests" always;
        }
        location = /admin/ {
            return 308 /admin;
        }
        location /admin/ {
            set $backend_admin http://backend:8000;
            proxy_pass $backend_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $public_scheme;
        }
        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $public_scheme;
        }
    }
}
