events { worker_connections 1024; }

http {
    # --- 1. API YÖNLENDİRMESİ (api.gamemetrix.me) ---
    server {
        listen 80;
        listen [::]:80; # bwCloud IPv6 trafiğini yakalamak için şart
        server_name api.gamemetrix.me;

        location / {
            proxy_pass http://backend:8000; # docker-compose'daki backend servis adı ve portu
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- 2. ANA SİTE YÖNLENDİRMESİ (gamemetrix.me) ---
    server {
        listen 80;
        listen [::]:80;
        server_name gamemetrix.me www.gamemetrix.me;

        location / {
            proxy_pass http://frontend:3000; # docker-compose'daki frontend servis adı ve portu
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}