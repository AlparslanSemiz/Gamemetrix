events { worker_connections 1024; }
http {
    client_max_body_size 1m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    # Compression. HTML, the JSON API and the sitemap are all highly compressible
    # and were previously served raw, which costs Core Web Vitals on every page.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/xml+rss
        application/json
        application/javascript
        application/manifest+json
        image/svg+xml;

    # Docker's published-port path may present the bridge gateway as nginx's
    # direct peer, so source-IP gating here causes a Cloudflare HTTPS redirect
    # loop. Origin-level proxy authentication is required before this header can
    # be restricted by peer without breaking the deployed topology.
    map $http_x_forwarded_proto $public_scheme {
        default $scheme;
        https https;
        http http;
    }

    # Client IP resolution.
    #
    # CF-Connecting-IP is only honoured when the request actually arrives from a
    # Cloudflare edge address. Previously any caller could set that header and be
    # believed, which let one attacker rotate it to get unlimited attempts against
    # the auth endpoints (the rate limiter keys on this value) and to write forged
    # addresses into the audit and analytics tables.
    #
    # If the deployment is not behind Cloudflare these ranges simply never match
    # and $remote_addr stays the direct peer address, which is the correct answer.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    map $remote_addr $public_client_ip {
        default $remote_addr;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.gamemetrix.me; frame-src https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self' https:; upgrade-insecure-requests" always;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://gamemetrix.me$request_uri;
    }

    # --- 1. API YÖNLENDİRMESİ (api.gamemetrix.me) ---
    server {
        listen 80;
        listen [::]:80;
        server_name api.gamemetrix.me;
        resolver 127.0.0.11 valid=30s;
        if ($public_scheme = http) {
            return 301 https://api.gamemetrix.me$request_uri;
        }
        location / {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $public_client_ip;
            proxy_set_header X-Forwarded-For $public_client_ip;
            proxy_set_header X-Forwarded-Proto $public_scheme;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name www.gamemetrix.me;
        return 301 https://gamemetrix.me$request_uri;
    }

    # --- 2. ANA SİTE YÖNLENDİRMESİ (gamemetrix.me) ---
    server {
        listen 80;
        listen [::]:80;
        server_name gamemetrix.me;
        resolver 127.0.0.11 valid=30s;
        if ($public_scheme = http) {
            return 301 https://gamemetrix.me$request_uri;
        }

        location = /robots.txt {
            set $frontend_robots http://frontend:3000;
            proxy_pass $frontend_robots;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $public_client_ip;
            proxy_hide_header Cache-Control;
            expires 1h;
        }
        location = /sitemap.xml {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $public_client_ip;
        }
        location /api/ {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $public_client_ip;
            proxy_set_header X-Forwarded-For $public_client_ip;
            proxy_set_header X-Forwarded-Proto $public_scheme;
        }
        location = /admin {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $public_client_ip;
            proxy_set_header X-Forwarded-For $public_client_ip;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            # Enforced here rather than via the route's headers() export, which the
            # v8_middleware future flag no longer applies. The admin shell must
            # never sit in a shared/edge cache.
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
        location = /admin/ {
            return 308 /admin;
        }
        location /admin/ {
            set $backend_admin http://backend:8000;
            proxy_pass $backend_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $public_client_ip;
            proxy_set_header X-Forwarded-For $public_client_ip;
            proxy_set_header X-Forwarded-Proto $public_scheme;
        }
        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $public_client_ip;
            proxy_set_header X-Forwarded-For $public_client_ip;
            proxy_set_header X-Forwarded-Proto $public_scheme;
        }
    }
}
