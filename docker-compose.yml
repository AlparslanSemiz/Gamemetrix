services:
  # --- 1. VERİ TABANI (PostgreSQL) ---
  db:
    image: postgres:15-alpine
    container_name: gamemetrix-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER before running docker compose}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before running docker compose}
      POSTGRES_DB: ${POSTGRES_DB:-gamemetrix}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    # postgres:15-alpine idles ~20-25MB; 160m covers connection/autovacuum
    # bursts without letting a runaway query eat the whole 1GB host.
    mem_limit: 160m
    mem_reservation: 64m
    memswap_limit: 224m # mem_limit + 64m swap cushion (not unbounded swap use)
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- 2. BACKEND (FastAPI) ---
  backend:
    build:
      context: ./backend # backend klasörünün yolu
      dockerfile: Dockerfile # backend içindeki Dockerfile adı (genelde Dockerfile olur)
    container_name: gamemetrix-backend
    restart: always
    # DATABASE_URL and every other secret come from backend/.env, which is
    # gitignored and is the server's source of truth. It is deliberately NOT set
    # in an `environment:` block here: that block overrides env_file, so building
    # the URL from the db service's POSTGRES_* variables silently ignored the
    # working value in backend/.env and made the backend depend on variables
    # intended for a different service.
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    # Single uvicorn worker (see Dockerfile CMD) is I/O-bound most of the time;
    # 400m gives headroom for RAWG import / refresh-all batches without
    # letting a leak or traffic spike take down the whole VM.
    mem_limit: 400m
    mem_reservation: 150m
    memswap_limit: 528m # +128m swap cushion for heavy-job memory spikes
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # --- 3. FRONTEND (React / Vite) ---
  frontend:
    build:
      context: ./frontend # frontend klasörünün yolu
      dockerfile: Dockerfile
    container_name: gamemetrix-frontend
    restart: always
    environment:
      INTERNAL_API_BASE_URL: http://backend:8000
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      - backend
    mem_limit: 192m
    mem_reservation: 64m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # --- 4. ORKESTRA ŞEFİ / REVERSE PROXY (Nginx) ---
  nginx:
    image: nginx:alpine
    container_name: gamemetrix-nginx
    restart: always
    ports:
      - "80:80" # Dış dünyadan gelen HTTP isteklerini yakalar
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # Kök dizindeki nginx.conf'u içeri bağlar
    depends_on:
      - backend
      - frontend
    mem_limit: 48m
    mem_reservation: 16m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata: # Veri tabanı verilerinin sunucu kapansa bile silinmemesini sağlar
