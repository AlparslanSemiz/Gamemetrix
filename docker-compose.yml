services:
  # --- 1. VERİ TABANI (PostgreSQL) ---
  db:
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    container_name: gamemetrix-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER before running docker compose}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before running docker compose}
      POSTGRES_DB: ${POSTGRES_DB:-gamemetrix}
    ports:
      # Keep host-side development access without publishing PostgreSQL to the
      # LAN or Internet. Containers still connect over the compose network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # PostgreSQL's image defaults (128MB shared buffers + 64MB maintenance
    # memory + 100 connections) do not fit a 160MB cgroup during catalog
    # imports. The app currently uses fewer than ten connections; these bounded
    # settings preserve query headroom without relying on swap.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    # With the bounded server settings above, 160m covers connection/autovacuum
    # bursts without letting a runaway query eat the whole 1GB host.
    mem_limit: 160m
    mem_reservation: 64m
    memswap_limit: 224m # mem_limit + 64m swap cushion (not unbounded swap use)
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- 2. BACKEND (FastAPI) ---
  backend:
    build:
      context: ./backend # backend klasörünün yolu
      dockerfile: Dockerfile # backend içindeki Dockerfile adı (genelde Dockerfile olur)
    container_name: gamemetrix-backend
    restart: always
    # Provider/application secrets come from backend/.env. Docker's database URL
    # is deliberately built from the same required POSTGRES_* values as the db
    # service, so a stale host-only or legacy SQLite URL in backend/.env cannot
    # make the container open a second catalog.
    env_file:
      - ./backend/.env
    environment:
      ENV: ${ENV:?Set ENV to development, test, or production}
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:?Set APP_DB_USER before running docker compose}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD before running docker compose}@db:5432/${POSTGRES_DB:-gamemetrix}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    # Single uvicorn worker (see Dockerfile CMD) is I/O-bound most of the time;
    # 400m gives headroom for RAWG import / refresh-all batches without
    # letting a leak or traffic spike take down the whole VM.
    mem_limit: 400m
    mem_reservation: 150m
    memswap_limit: 528m # +128m swap cushion for heavy-job memory spikes
    cpus: 0.75
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # --- 3. FRONTEND (React / Vite) ---
  frontend:
    build:
      context: ./frontend # frontend klasörünün yolu
      dockerfile: Dockerfile
      args:
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    container_name: gamemetrix-frontend
    restart: always
    environment:
      INTERNAL_API_BASE_URL: http://backend:8000
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 192m
    mem_reservation: 64m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # --- 4. ORKESTRA ŞEFİ / REVERSE PROXY (Nginx) ---
  nginx:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: gamemetrix-nginx
    restart: always
    ports:
      - "80:8080" # Dış dünyadan gelen HTTP isteklerini yakalar
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # Kök dizindeki nginx.conf'u içeri bağlar
      - ./ops/nginx-origin-tls-disabled.conf:/etc/nginx/origin-tls.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    mem_limit: 48m
    mem_reservation: 16m
    cpus: 0.25
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata: # Veri tabanı verilerinin sunucu kapansa bile silinmemesini sağlar
