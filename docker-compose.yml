services:
  # --- 1. Database (PostgreSQL) ---
  db:
    image: postgres:15-alpine@sha256:23799e521dee9265a8b388ecf3bc0f1eaa34b95be67f5a76af4f8f6adb44c720
    container_name: gamemetrix-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER before running docker compose}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before running docker compose}
      POSTGRES_DB: ${POSTGRES_DB:-gamemetrix}
    ports:
      # Keep host-side development access without publishing PostgreSQL to the
      # LAN or Internet. Containers still connect over the compose network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # PostgreSQL's image defaults (128MB shared buffers + 64MB maintenance
    # memory + 100 connections) do not fit a 224MB cgroup. Budget: shared_buffers 80MB
    # + ~30 backends x ~3-5MB (work_mem 4MB is per sort node, so a few concurrent sorts)
    # + autovacuum/maintenance 32MB stays inside 224MB; swap (memswap_limit) is only a cushion.
    # Backend pools cap at 12 (request: 8+4) + 4 (background: 2+2) = 16 connections, leaving
    # 14 for superuser-reserved slots (3), alembic, backups, psql and the watchdog.
    command:
      - postgres
      - -c
      - shared_buffers=80MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
      # Keep the planner honest about a 224MB container and cost random reads like the
      # SSD they are so index scans win over seq scans.
      - -c
      - effective_cache_size=192MB
      - -c
      - random_page_cost=1.1
      # JIT compile time dwarfs these short OLTP queries; it also costs memory.
      - -c
      - jit=off
      # Background jobs once left transactions idle for 14-36 s holding locks/snapshots.
      - -c
      - idle_in_transaction_session_timeout=60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    # With the bounded server settings above, 160m covers connection/autovacuum
    # bursts without letting a runaway query eat the whole 1GB host.
    mem_limit: 224m
    mem_reservation: 64m
    memswap_limit: 352m # mem_limit + 128m swap cushion (160m OOM-killed on 2026-11-17) (not unbounded swap use)
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- 2. BACKEND (FastAPI) ---
  backend:
    # Production pulls the image CI built (GAMEMETRIX_IMAGE_PREFIX=ghcr.io/<owner>/gamemetrix,
    # GAMEMETRIX_TAG=sha-<commit>, written by ops/deploy-production.sh). Without them this
    # builds locally as gamemetrix-backend:local. There is no :latest anywhere on purpose.
    image: ${GAMEMETRIX_IMAGE_PREFIX:-gamemetrix}-backend:${GAMEMETRIX_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamemetrix-backend
    restart: always
    # Provider/application secrets come from backend/.env. Docker's database URL
    # is deliberately built from the same required POSTGRES_* values as the db
    # service, so a stale host-only or legacy SQLite URL in backend/.env cannot
    # make the container open a second catalog.
    env_file:
      - ./backend/.env
    environment:
      ENV: ${ENV:?Set ENV to development, test, or production}
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:?Set APP_DB_USER before running docker compose}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD before running docker compose}@db:5432/${POSTGRES_DB:-gamemetrix}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    # Single uvicorn worker (see Dockerfile CMD) is I/O-bound most of the time;
    # 400m gives headroom for RAWG import / refresh-all batches without
    # letting a leak or traffic spike take down the whole VM.
    mem_limit: 400m
    mem_reservation: 150m
    memswap_limit: 1424m # 400m RAM + 1 GiB swap (host has 4 GiB swap); spikes slow down instead of OOM-killing
    cpus: 0.75
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # --- 3. FRONTEND (React / Vite) ---
  frontend:
    image: ${GAMEMETRIX_IMAGE_PREFIX:-gamemetrix}-frontend:${GAMEMETRIX_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
        VITE_CF_BEACON_TOKEN: ${VITE_CF_BEACON_TOKEN:-}
    container_name: gamemetrix-frontend
    restart: always
    environment:
      INTERNAL_API_BASE_URL: http://backend:8000
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 192m
    mem_reservation: 64m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # --- 4. Reverse proxy (nginx) ---
  nginx:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: gamemetrix-nginx
    restart: always
    ports:
      - "80:8080" # public HTTP, behind Cloudflare
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx-origin-tls-disabled.conf:/etc/nginx/origin-tls.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    mem_limit: 48m
    mem_reservation: 16m
    cpus: 0.25
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata: # database files survive container recreation
