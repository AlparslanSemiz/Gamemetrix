<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="g" x1="3" y1="3" x2="45" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="48" height="48" rx="10" fill="#0e0e12"/>
  <!-- Ring track (dim) -->
  <circle cx="24" cy="24" r="17" stroke="#1e1e2a" stroke-width="3.5"/>
  <!-- Score arc: ~270° filled, gap at bottom-left; circumference≈107, filled=81 gap=26 -->
  <circle cx="24" cy="24" r="17" stroke="url(#g)" stroke-width="3.5"
    stroke-dasharray="81 26" stroke-dashoffset="20" stroke-linecap="round"/>
  <!-- Three metric bars inside the ring -->
  <rect x="15.5" y="28" width="4" height="6.5" rx="1.5" fill="#8b5cf6" opacity="0.75"/>
  <rect x="22"   y="20" width="4" height="14.5" rx="1.5" fill="url(#g)"/>
  <rect x="28.5" y="24.5" width="4" height="10" rx="1.5" fill="#22c55e" opacity="0.8"/>
</svg>
