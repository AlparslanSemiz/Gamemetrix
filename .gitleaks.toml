# Default gitleaks rules plus one narrow exception.
# The Cloudflare Web Analytics beacon token of the "testler" site is public by design:
# browsers receive it in the page (frontend/src/root.tsx). It grants no access to anything.
[extend]
useDefault = true

[[allowlists]]
description = "Public Cloudflare Web Analytics beacon token (testler site)"
regexes = ['''0ead9632eeb34bfdbca243e769478158''']
