# Weekly dependency update PRs, grouped so one ecosystem is one PR instead of a dozen.
# CI (including pip-audit / npm audit) runs on each; nothing merges itself.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    # SQLAlchemy 2.1 is a planned, reviewed upgrade (decision: stay <2.1 for now);
    # 2.0.x patches still arrive through the group below.
    ignore:
      - dependency-name: sqlalchemy
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # Dockerfile base images (digest-pinned), one entry per directory that has one.
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
      day: monday
    # Python/Node runtime majors change the platform under the app: review by hand.
    # Python 3.11 -> 3.15 is a "minor" tag bump to Dependabot: only digests/patches here.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-base-images:
        patterns: ["*"]

  # Image digests in docker-compose.yml (postgres, nginx). The CI postgres service
  # in .github/workflows/ci.yml is pinned to the same digest by hand: bump both together.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A postgres major (15 -> 18) cannot open the old data directory: it needs a
    # planned dump/restore with a backup, never an automatic PR + auto-deploy.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      compose-images:
        patterns: ["*"]
