name: images

# Builds the backend and frontend images for a main commit ONLY AFTER the CI workflow
# for that exact commit finished successfully, and publishes them to GitHub Container
# Registry, so the 1 GB production host only pulls finished images instead of compiling
# them on one CPU. Each architecture builds natively (amd64 for the current host, arm64
# for an Oracle Ampere host) and both are merged into one tag.
#
#   ghcr.io/<owner>/gamemetrix-backend:sha-<full sha>
#   ghcr.io/<owner>/gamemetrix-frontend:sha-<full sha>
#
# There is deliberately no :latest tag: deploys always pin sha-<commit>, and a moving
# tag would let a plain `docker compose pull` ship an untested image.
# Running it by hand (workflow_dispatch) builds the commit the run was started on.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # The commit CI verified (workflow_run), or the dispatched commit.
  IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        service: [backend, frontend]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gamemetrix-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ steps.name.outputs.image }}:sha-${{ env.IMAGE_SHA }}-${{ matrix.arch }}
          build-args: |
            VITE_GA_MEASUREMENT_ID=${{ vars.VITE_GA_MEASUREMENT_ID }}
            VITE_CF_BEACON_TOKEN=${{ vars.VITE_CF_BEACON_TOKEN }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.IMAGE_SHA }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}

  merge:
    needs: build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: One tag for both architectures
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gamemetrix-${{ matrix.service }}"
          docker buildx imagetools create \
            -t "$image:sha-${IMAGE_SHA}" \
            "$image:sha-${IMAGE_SHA}-amd64" "$image:sha-${IMAGE_SHA}-arm64"
          docker buildx imagetools inspect "$image:sha-${IMAGE_SHA}"
