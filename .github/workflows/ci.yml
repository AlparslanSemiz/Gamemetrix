name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gamemetrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d gamemetrix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/gamemetrix_test
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Compile backend modules
        working-directory: backend
        run: python -m compileall app alembic

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          python -m pip check
          python -m pip_audit -r requirements.txt -r requirements-dev.txt

      - name: Run Bandit security checks
        working-directory: backend
        run: bandit -q -r app -ll

      - name: Scan tracked files for secrets
        run: detect-secrets-hook --baseline .secrets.baseline.json $(git ls-files)

      - name: Validate production settings
        working-directory: backend
        env:
          ENV: production
          DATABASE_URL: postgresql+psycopg://app:placeholder@127.0.0.1:5432/gamemetrix
          JWT_SECRET_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          JWT_ISSUER: gamemetrix-api
          JWT_AUDIENCE: gamemetrix-admin
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD_HASH: $2b$12$123456789012345678901u12345678901234567890123456789012
          ACCOUNT_AUTH_ENABLED: "false"
          ACCOUNT_BASE_URL: https://gamemetrix.me
          CORS_ALLOW_ORIGINS: https://gamemetrix.me,https://www.gamemetrix.me
        run: python -c "from app.config import Settings; Settings().validate()"

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_USER: gamemetrix
          POSTGRES_PASSWORD: ci-placeholder
          APP_DB_USER: gamemetrix_app
          APP_DB_PASSWORD: ci-app-placeholder
          ENV: production
        run: |
          cp backend/.env.example backend/.env
          docker compose config --quiet

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit production Node dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Run Lighthouse checks
        working-directory: frontend
        run: node tests/lighthouse-ci.mjs

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-test-results-${{ github.run_attempt }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
